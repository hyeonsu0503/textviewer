<style>
  :root{
    --bg:#fbfaf7; --fg:#222; --muted:#888; --line:#e3e0d8; --accent:#2f6fde; --mark:#ffe36b;
    --fs:18px; --lhpx:32px; --font:-apple-system, "Apple SD Gothic Neo", sans-serif; --pad:20px; --mw:none;
  }
  body.sepia{ --bg:#f4ecd8; --fg:#4b3b2a; --muted:#8a7a66; --line:#ddd0b0; --mark:#f5c96a; }
  body.dark { --bg:#121212; --fg:#d6d6d6; --muted:#777; --line:#333; --accent:#6ea0ff; --mark:#806a00; }
  body.black{ --bg:#000; --fg:#bdbdbd; --muted:#666; --line:#222; --accent:#6ea0ff; --mark:#6b5800; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);overscroll-behavior:none}
  body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
  button,select,input{font:inherit;color:inherit}
  #probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  /* 본문 영역: 상태바/홈 표시줄 밖의 '딱 n줄' 높이로만 존재. 문서 자체는 스크롤되지 않음 */
  #view{position:fixed;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
  #view2{position:fixed;overflow:hidden;background:var(--bg);display:none;box-shadow:inset 1px 0 0 var(--line)}
  body.spread #view2{display:block}
  body.spread #view{overflow:hidden}
  #reader,#reader2{padding:0 calc(var(--pad) + env(safe-area-inset-right)) 0 calc(var(--pad) + env(safe-area-inset-left));
          font-family:var(--font);font-size:var(--fs);line-height:var(--lhpx);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
          max-width:var(--mw);margin:0 auto}
  #reader .c,#reader2 .c{margin:0}
  mark{background:var(--mark);color:inherit;border-radius:3px;line-height:inherit}
  #empty{text-align:center;padding:20vh 24px 0;color:var(--muted);white-space:normal;font-family:-apple-system,sans-serif;font-size:16px;line-height:1.6}
  #empty h1{font-size:22px;color:var(--fg);margin:0 0 8px}
  #empty .row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  .bar{position:fixed;left:0;right:0;z-index:10;background:var(--bg);border-color:var(--line)}
  #tools{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  #bottom{bottom:0;border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
  body.hideui #bottom{display:none}
  #title{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:15px;min-height:40px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .icon{min-width:40px;padding:8px}
  #progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  #progress input{flex:1;accent-color:var(--accent)}

  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
         padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(110%);transition:transform .25s;max-height:80vh;
         overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .panel.open{transform:none}
  #backdrop{position:fixed;inset:0;z-index:15;background:transparent;display:none;touch-action:none}
  body.paneled #backdrop{display:block}
  .panel h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .set:last-child{border-bottom:0}
  .seg{display:flex;gap:6px;flex-wrap:nowrap;flex-shrink:0;justify-content:flex-end}
  .set > div:first-child{min-width:0}
  .seg .btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .seg .btn{min-width:38px;padding:8px 10px}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
  .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  select{font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
  #searchbar{display:none;gap:6px;align-items:center;margin-bottom:8px}
  #searchbar.open{display:flex}
  #q{flex:1;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
  #count{font-size:13px;color:var(--muted);min-width:52px;text-align:center}
  textarea{width:100%;height:40vh;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  #toast.show{opacity:1}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div id="probe"></div>
<div id="view"><div id="reader"><div id="empty">
  <h1>텍스트 뷰어</h1>
  .txt 파일을 열거나 텍스트를 붙여넣어 읽어보세요.<br>한글(EUC-KR/CP949) 파일도 자동으로 인식합니다.
  <div class="row">
    <button class="btn primary" id="openBtn2">파일 열기</button>
    <button class="btn" id="pasteBtn">텍스트 붙여넣기</button>
  </div>
  <div class="row" id="resumeRow" style="display:none"><button class="btn" id="resumeBtn">마지막 문서 이어 읽기</button></div>
</div></div></div>
<div id="view2"><div id="reader2"></div></div>

<div id="bottom" class="bar">
  <div id="searchbar">
    <input id="q" type="search" placeholder="본문 검색" enterkeyhint="search" autocomplete="off">
    <span id="count"></span>
    <button class="btn icon" id="prevBtn">▲</button>
    <button class="btn icon" id="nextBtn">▼</button>
  </div>
  <div id="tools">
    <button class="btn icon" id="openBtn" aria-label="파일 열기">📂</button>
    <div id="title">텍스트 뷰어</div>
    <button class="btn icon" id="searchBtn" aria-label="검색">🔍</button>
    <button class="btn icon" id="setBtn" aria-label="설정">Aa</button>
  </div>
  <div id="progress">
    <input id="slider" type="range" min="0" max="1000" value="0">
    <span id="pct">0%</span>
  </div>
</div>

<div id="backdrop"></div>

<div class="panel" id="setPanel">
  <h2>보기 설정 <button class="btn" data-close>닫기</button></h2>
  <div class="set">글자 크기
    <div class="seg"><button class="btn icon" id="fsDown">가−</button><span id="fsVal" style="min-width:36px;text-align:center"></span><button class="btn icon" id="fsUp">가+</button></div></div>
  <div class="set">줄 간격
    <div class="seg" id="lhSeg"><button class="btn" data-v="1.5">좁게</button><button class="btn" data-v="1.8">보통</button><button class="btn" data-v="2.2">넓게</button></div></div>
  <div class="set">위 여백 (줄)
    <div class="seg" id="mtSeg"><button class="btn" data-v="0">0</button><button class="btn" data-v="1">1</button><button class="btn" data-v="2">2</button><button class="btn" data-v="3">3</button></div></div>
  <div class="set">아래 여백 (줄)
    <div class="seg" id="mbSeg"><button class="btn" data-v="0">0</button><button class="btn" data-v="1">1</button><button class="btn" data-v="2">2</button><button class="btn" data-v="3">3</button></div></div>
  <div class="set"><div>겹쳐 보일 줄<div class="hint">넘길 때 이전 페이지 끝줄을 위에 남김</div></div>
    <div class="seg" id="ovSeg"><button class="btn" data-v="0">0</button><button class="btn" data-v="1">1</button><button class="btn" data-v="2">2</button><button class="btn" data-v="3">3</button></div></div>
  <div class="set">양쪽 보기
    <div class="seg" id="spreadSeg"><button class="btn" data-v="off">끄기</button><button class="btn" data-v="land">가로일 때</button><button class="btn" data-v="on">항상</button></div></div>
  <div class="set">좌우 여백
    <div class="seg" id="padSeg"><button class="btn" data-v="4">0</button><button class="btn" data-v="12">좁게</button><button class="btn" data-v="20">보통</button><button class="btn" data-v="40">넓게</button></div></div>
  <div class="set">본문 최대 폭
    <div class="seg" id="mwSeg"><button class="btn" data-v="700">좁게</button><button class="btn" data-v="1000">보통</button><button class="btn" data-v="none">꽉 차게</button></div></div>
  <div class="set"><div>빈 줄 줄이기<div class="hint">문단 사이 빈 줄 정리</div></div>
    <div class="seg" id="blankSeg"><button class="btn" data-v="off">원본</button><button class="btn" data-v="one">한 줄만</button><button class="btn" data-v="none">없애기</button></div></div>
  <div class="set">글꼴
    <div class="seg" id="fontSeg"><button class="btn" data-v="sans">고딕</button><button class="btn" data-v="serif">명조</button><button class="btn" data-v="mono">고정폭</button></div></div>
  <div class="set">배경
    <div class="seg" id="themeSeg">
      <button class="sw" data-v="light" style="background:#fbfaf7" aria-label="밝게"></button>
      <button class="sw" data-v="sepia" style="background:#f4ecd8" aria-label="세피아"></button>
      <button class="sw" data-v="dark" style="background:#121212" aria-label="어둡게"></button>
      <button class="sw" data-v="black" style="background:#000" aria-label="검정"></button>
    </div></div>
  <div class="set"><div>탭으로 페이지 넘기기<div class="hint">위·왼쪽: 이전 · 아래·오른쪽: 다음 · 가운데: 메뉴</div></div>
    <div class="seg" id="tapSeg"><button class="btn" data-v="1">켜기</button><button class="btn" data-v="0">끄기</button></div></div>
  <div class="set">문자 인코딩
    <select id="enc">
      <option value="auto">자동</option><option value="utf-8">UTF-8</option><option value="euc-kr">EUC-KR / CP949</option>
      <option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option><option value="shift_jis">Shift_JIS</option><option value="gb18030">GB18030</option>
    </select></div>
</div>

<div class="panel" id="pastePanel">
  <h2>텍스트 붙여넣기 <button class="btn" data-close>닫기</button></h2>
  <textarea id="pasteArea" placeholder="여기에 길게 눌러 붙여넣기"></textarea>
  <div style="margin-top:10px;text-align:right"><button class="btn primary" id="pasteOk">읽기</button></div>
</div>

<input type="file" id="file" accept=".txt,.text,.md,.log,.csv,.srt,.smi,text/*" hidden>
<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const view = $('#view'), reader = $('#reader'), view2 = $('#view2'), reader2 = $('#reader2'), body = document.body;
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('tv.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('tv.'+k, JSON.stringify(v)); }catch(e){} }
  };
  function idb(){ return new Promise((res, rej) => { try{
      const r = indexedDB.open('textviewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('docs');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }catch(e){ rej(e); } }); }
  async function saveLast(d){ try{ const db = await idb(); db.transaction('docs','readwrite').objectStore('docs').put(d,'last'); }catch(e){} }
  async function loadLast(){ try{ const db = await idb(); return await new Promise(res => {
      const r = db.transaction('docs').objectStore('docs').get('last'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }catch(e){ return null; } }

  // ---- 설정 ----
  const cfg = Object.assign({fs:18, lh:'1.8', pad:'20', font:'sans', theme:'light', tap:'1', enc:'auto', mt:'1', mb:'0', ov:'1', blank:'off', spread:'land', mw:'none'}, store.get('cfg', {}));
  if ((cfg.v||0) < 4){ cfg.mt = '1'; cfg.mb = '0'; cfg.v = 4; }
  const fonts = { sans:'-apple-system, "Apple SD Gothic Neo", sans-serif',
                  serif:'"AppleMyungjo", "Nanum Myeongjo", "Noto Serif KR", Georgia, serif',
                  mono:'ui-monospace, Menlo, "D2Coding", monospace' };
  const SEGS = [['#lhSeg','lh'],['#padSeg','pad'],['#fontSeg','font'],['#themeSeg','theme'],['#tapSeg','tap'],['#spreadSeg','spread'],['#mwSeg','mw'],['#mtSeg','mt'],['#mbSeg','mb'],['#ovSeg','ov'],['#blankSeg','blank']];
  // 줄 높이는 정수 px로 고정 (소수점 누적 오차로 줄이 잘리는 것 방지)
  function LH(){ return Math.round(cfg.fs * parseFloat(cfg.lh)); }

  function applyCfg(){
    const r = document.documentElement.style;
    r.setProperty('--fs', cfg.fs+'px'); r.setProperty('--lhpx', LH()+'px'); r.setProperty('--pad', cfg.pad+'px'); r.setProperty('--mw', cfg.mw === 'none' ? 'none' : cfg.mw+'px'); r.setProperty('--font', fonts[cfg.font]);
    body.classList.remove('sepia','dark','black'); if (cfg.theme !== 'light') body.classList.add(cfg.theme);
    $('#fsVal').textContent = cfg.fs;
    SEGS.forEach(([sel,k]) => document.querySelectorAll(sel+' [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === String(cfg[k]))));
    $('#enc').value = cfg.enc;
    store.set('cfg', cfg);
    layout();
  }

  // ---- 레이아웃: 본문 창을 '안전 영역 + 여백 줄 수' 안쪽에 정확히 n줄 높이로 배치 ----
  let nLines = 10, spread = false, chunkEls2 = [], r2key = '';
  // 양쪽 보기: 오른쪽 쪽은 같은 글을 복제해서 n줄 아래부터 보여줌
  function fillReader2(){
    const k = key + '|' + cfg.blank;
    if (!doc || r2key === k) return;
    reader2.textContent = ''; chunkEls2 = [];
    const frag = document.createDocumentFragment();
    for (const [a,b] of chunks){ const d = document.createElement('div'); d.className='c'; d.textContent = doc.text.slice(a,b); frag.appendChild(d); chunkEls2.push(d); }
    reader2.appendChild(frag); r2key = k;
  }
  function layout(){
    const st = parseFloat(getComputedStyle($('#probe')).paddingTop) || 0;
    const lh = LH(), H = document.documentElement.clientHeight || innerHeight;
    // 여백 0 = 상태바 바로 아래 / 화면 맨 아래 가장자리. 한 줄이 안 되는 남는 공간은 위쪽으로.
    const mt = Number(cfg.mt), mb = Number(cfg.mb);
    const avail = H - st - (mt + mb) * lh;
    nLines = Math.max(3, Math.floor(avail / lh));
    const W = document.documentElement.clientWidth || innerWidth;
    spread = !!doc && (cfg.spread === 'on' || (cfg.spread === 'land' && W > H && W >= 700));
    body.classList.toggle('spread', spread);
    for (const v of [view, view2]){ v.style.top = 'auto'; v.style.bottom = (mb * lh) + 'px'; v.style.height = (nLines * lh) + 'px'; }
    if (spread){
      view.style.left = '0'; view.style.right = 'auto'; view.style.width = Math.floor(W/2) + 'px';
      view2.style.left = Math.floor(W/2) + 'px'; view2.style.width = Math.floor(W/2) + 'px'; // 두 쪽 폭을 똑같이 해야 줄바꿈이 같아짐
      fillReader2();
    } else { view.style.left = '0'; view.style.right = '0'; view.style.width = ''; }
    // 마지막 페이지도 맨 윗줄부터 맞춰 보이도록 아래 공간
    reader.style.paddingBottom = doc ? ((nLines * (spread ? 2 : 1) - 1) * lh) + 'px' : '0';
    reader2.style.paddingBottom = (2 * nLines * lh) + 'px';
  }

  function keepPos(fn){ const line = topLine(); fn(); applyCfg(); setTopLine(line); }
  $('#fsUp').onclick = () => keepPos(() => cfg.fs = Math.min(40, cfg.fs + 1));
  $('#fsDown').onclick = () => keepPos(() => cfg.fs = Math.max(11, cfg.fs - 1));
  SEGS.filter(([,k]) => k !== 'blank').forEach(([sel,k]) =>
    document.querySelectorAll(sel+' [data-v]').forEach(b => b.onclick = () => {
      if (k === 'lh' || k === 'pad' || k === 'font' || k === 'mw' || k === 'spread'){ const p = getRatio(); cfg[k] = b.dataset.v; applyCfg(); setRatio(p); }
      else keepPos(() => cfg[k] = b.dataset.v);
    }));
  document.querySelectorAll('#blankSeg [data-v]').forEach(b => b.onclick = () => {
    cfg.blank = b.dataset.v; const p = getRatio(); applyCfg(); if (doc) render(doc.raw, doc.name, doc.buf, p); });
  $('#enc').onchange = e => { cfg.enc = e.target.value; applyCfg(); if (doc && doc.buf) render(decode(doc.buf), doc.name, doc.buf, getRatio()); };

  // ---- 패널 ----
  function openPanel(id){ document.querySelectorAll('.panel').forEach(p => p.classList.toggle('open', p.id === id)); body.classList.toggle('paneled', !!id); }
  function closePanels(){ openPanel(null); }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePanels);
  $('#backdrop').addEventListener('click', closePanels);
  $('#backdrop').addEventListener('touchmove', e => e.preventDefault(), {passive:false});
  $('#setBtn').onclick = () => openPanel($('#setPanel').classList.contains('open') ? null : 'setPanel');
  $('#pasteBtn').onclick = () => { openPanel('pastePanel'); setTimeout(() => $('#pasteArea').focus(), 250); };
  $('#pasteOk').onclick = () => { const t = $('#pasteArea').value; if (!t.trim()) return; closePanels(); $('#pasteArea').value=''; render(t, '붙여넣은 텍스트'); };

  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400); }

  // ---- 파일 열기 / 디코딩 ----
  const fileIn = $('#file');
  $('#openBtn').onclick = $('#openBtn2').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; if (!f) return; fileIn.value = '';
    const buf = new Uint8Array(await f.arrayBuffer());
    render(decode(buf), f.name, buf);
  };
  function tryDecode(enc, buf, fatal){ try{ return new TextDecoder(enc, {fatal}).decode(buf); }catch(e){ return null; } }
  function decode(buf){
    if (cfg.enc !== 'auto') return tryDecode(cfg.enc, buf, false) ?? tryDecode('utf-8', buf, false);
    if (buf[0]===0xEF && buf[1]===0xBB && buf[2]===0xBF) return tryDecode('utf-8', buf.subarray(3), false);
    if (buf[0]===0xFF && buf[1]===0xFE) return tryDecode('utf-16le', buf.subarray(2), false);
    if (buf[0]===0xFE && buf[1]===0xFF) return tryDecode('utf-16be', buf.subarray(2), false);
    const u = tryDecode('utf-8', buf, true); if (u != null) return u;
    const k = tryDecode('euc-kr', buf, false); if (k != null) { toast('EUC-KR로 열었습니다'); return k; }
    return tryDecode('utf-8', buf, false);
  }

  // ---- 렌더링 ----
  let doc = null, chunks = [], chunkEls = [], key = '';
  const CHUNK = 4000;
  function hashKey(name, text){ let h = 0; const s = text.slice(0, 2000); for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0; return name + ':' + text.length + ':' + h; }
  function render(text, name, buf, ratio){
    const raw = text.replace(/\r\n?/g, '\n');
    key = hashKey(name, raw);
    if (cfg.blank === 'one') text = raw.replace(/\n([ \t　]*\n)+/g, '\n\n');
    else if (cfg.blank === 'none') text = raw.replace(/\n([ \t　]*\n)+/g, '\n');
    else text = raw;
    doc = { name, text, raw, buf: buf || null };
    chunks = []; let i = 0;
    while (i < text.length){
      let end = Math.min(text.length, i + CHUNK);
      if (end < text.length){ const nl = text.indexOf('\n', end); end = nl === -1 || nl - end > 2000 ? end : nl + 1; }
      chunks.push([i, end]); i = end;
    }
    reader.textContent = ''; chunkEls = [];
    const frag = document.createDocumentFragment();
    for (const [a,b] of chunks){ const d = document.createElement('div'); d.className='c'; d.textContent = text.slice(a,b); frag.appendChild(d); chunkEls.push(d); }
    reader.appendChild(frag);
    reader2.textContent = ''; chunkEls2 = []; r2key = '';
    $('#title').textContent = name; document.title = name + ' – 텍스트 뷰어';
    hits = []; curHit = -1; markedChunk = -1; $('#count').textContent = '';
    layout();
    if ($('#q').value) doSearch();
    requestAnimationFrame(() => setRatio(ratio ?? (store.get('pos', {})[key] || 0)));
    saveLast({ name, text: raw, buf: buf || null });
  }

  // ---- 위치 (항상 줄 단위) ----
  function maxScroll(){ return Math.max(1, view.scrollHeight - view.clientHeight); }
  function topLine(){ return Math.round(view.scrollTop / LH()); }
  function setTopLine(n){ view.scrollTop = Math.max(0, n) * LH(); if (spread) view2.scrollTop = view.scrollTop + nLines * LH(); updateProgress(); if (spread && typeof savePos === 'function') savePos(); }
  function getRatio(){ return view.scrollTop / maxScroll(); }
  function setRatio(r){ setTopLine(Math.round(r * maxScroll() / LH())); }
  function snap(){ if (spread) return; const y = topLine() * LH(); if (Math.abs(view.scrollTop - y) > 0.5) view.scrollTop = y; }
  function updateProgress(){
    const r = doc ? Math.min(1, getRatio()) : 0;
    $('#slider').value = Math.round(r*1000); $('#pct').textContent = (r*100).toFixed(1) + '%';
  }
  let idleT;
  view.addEventListener('scroll', () => { updateProgress();
    clearTimeout(idleT); idleT = setTimeout(() => { if (!doc) return; snap();
      const p = store.get('pos', {}); p[key] = getRatio(); const ks = Object.keys(p); if (ks.length > 200) delete p[ks[0]]; store.set('pos', p); }, 180); }, {passive:true});
  $('#slider').oninput = e => { if (doc) setRatio(e.target.value / 1000); };
  addEventListener('resize', () => { const l = topLine(); layout(); setTopLine(l); });

  function page(dir){ const step = Math.max(1, nLines * (spread ? 2 : 1) - Number(cfg.ov)); setTopLine(topLine() + dir * step); }

  // ---- 탭 ----
  let swiped = false;
  function onTap(e){
    if (!doc) return;
    if (swiped){ swiped = false; return; }
    if (getSelection && String(getSelection())) return;
    if (spread){
      const x = e.clientX / (document.documentElement.clientWidth || innerWidth);
      if (cfg.tap === '1' && x < 0.3) page(-1);
      else if (cfg.tap === '1' && x > 0.7) page(1);
      else body.classList.toggle('hideui');
      return;
    }
    const rc = view.getBoundingClientRect(), y = (e.clientY - rc.top) / rc.height;
    if (cfg.tap === '1' && y < 0.3) page(-1);
    else if (cfg.tap === '1' && y > 0.7) page(1);
    else body.classList.toggle('hideui');
  }
  view.addEventListener('click', onTap); view2.addEventListener('click', onTap);
  // 양쪽 보기에서는 스와이프로 넘김 (←/↑ 다음, →/↓ 이전)
  let tx = 0, ty = 0;
  for (const v of [view, view2]){
    v.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
    v.addEventListener('touchmove', e => { if (spread) e.preventDefault(); }, {passive:false});
    v.addEventListener('touchend', e => {
      if (!spread) return;
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
      swiped = true; setTimeout(() => swiped = false, 400);
      if (Math.abs(dx) > Math.abs(dy)) page(dx < 0 ? 1 : -1); else page(dy < 0 ? 1 : -1);
    });
  }
  // 양쪽 보기 위치 저장
  function savePos(){ if (!doc) return; const p = store.get('pos', {}); p[key] = getRatio(); const ks = Object.keys(p); if (ks.length > 200) delete p[ks[0]]; store.set('pos', p); }
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); page(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); page(-1); }
  });

  // ---- 검색 ----
  let hits = [], curHit = -1, markedChunk = -1;
  $('#searchBtn').onclick = () => { const sb = $('#searchbar'); sb.classList.toggle('open'); body.classList.remove('hideui');
    if (sb.classList.contains('open')) $('#q').focus(); else clearMark(); };
  let qT; $('#q').oninput = () => { clearTimeout(qT); qT = setTimeout(doSearch, 250); };
  $('#q').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); $('#q').blur(); step(e.shiftKey ? -1 : 1); } };
  $('#nextBtn').onclick = () => step(1); $('#prevBtn').onclick = () => step(-1);
  function doSearch(){
    clearMark(); hits = []; curHit = -1;
    const q = $('#q').value; if (!doc || !q){ $('#count').textContent = ''; return; }
    const T = doc.text.toLowerCase(), Q = q.toLowerCase();
    let i = T.indexOf(Q); while (i !== -1 && hits.length < 10000){ hits.push(i); i = T.indexOf(Q, i + Q.length); }
    if (!hits.length){ $('#count').textContent = '0건'; return; }
    const here = Math.floor(getRatio() * doc.text.length);
    curHit = hits.findIndex(h => h >= here); if (curHit < 0) curHit = 0;
    show();
  }
  function step(d){ if (!hits.length){ doSearch(); return; } curHit = (curHit + d + hits.length) % hits.length; show(); }
  function clearMark(){ if (markedChunk >= 0){ const [a,b] = chunks[markedChunk]; const t = doc.text.slice(a,b); chunkEls[markedChunk].textContent = t; if (chunkEls2[markedChunk]) chunkEls2[markedChunk].textContent = t; markedChunk = -1; } }
  function show(){
    clearMark();
    const pos = hits[curHit], len = $('#q').value.length;
    const ci = chunks.findIndex(([a,b]) => pos >= a && pos < b); if (ci < 0) return;
    const [a,b] = chunks[ci], el = chunkEls[ci], t = doc.text;
    el.textContent = '';
    const m = document.createElement('mark'); m.textContent = t.slice(pos, pos+len);
    el.append(t.slice(a, pos), m, t.slice(pos+len, Math.max(b, pos+len)));
    if (chunkEls2[ci]){ const e2 = chunkEls2[ci]; e2.textContent = ''; e2.append(t.slice(a, pos), m.cloneNode(true), t.slice(pos+len, Math.max(b, pos+len))); }
    markedChunk = ci;
    const r = m.getBoundingClientRect(), vr = view.getBoundingClientRect();
    const lineOfMatch = Math.round((view.scrollTop + r.top - vr.top) / LH());
    if (spread){ const per = 2 * nLines; setTopLine(Math.floor(lineOfMatch / per) * per); }
    else setTopLine(lineOfMatch - Math.floor(nLines * 0.3));
    $('#count').textContent = (curHit+1) + '/' + hits.length;
  }

  // ---- 시작 ----
  applyCfg();
  loadLast().then(d => { if (d && d.text){ $('#resumeRow').style.display = ''; $('#resumeBtn').onclick = () => render(d.text, d.name, d.buf); } });
})();
</script>
</body>
</html>
